name: Update PROJECT_STATE

# PROJECT_STATE.md 재생성·커밋. 수동 실행(workflow_dispatch) 전용.
# ※ 자동 push 트리거는 비활성화됨 — 매 push마다 [skip ci] 커밋이 얹혀
#    배포가 건너뛰어지거나 걸리는 문제가 있어 끔. 필요하면 아래 push 블록을
#    되살리거나 Actions 탭에서 수동 실행(Run workflow)하면 된다.

on:
  workflow_dispatch:

concurrency:
  group: project-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate PROJECT_STATE.md
        run: node scripts/gen-project-state.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet PROJECT_STATE.md; then
            echo "변경 없음 — 건너뜀"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          git commit -m "chore: PROJECT_STATE 자동 갱신 [skip ci]"
          git push
