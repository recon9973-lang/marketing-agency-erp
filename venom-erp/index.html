  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);

    .topbar{padding:14px 16px}

const avatar = id => { const u=member(id);
  return `<span class="avatar" style="background:${avColor(u.name)}">${esc(initials(u.name))}</span>`; };

/* ---------- Router ---------- */
const NAV = [
  {grp:"운영"},
  {id:"dashboard",label:"대시보드",ic:"◎"},
  {id:"clients",label:"클라이언트",ic:"◇"},
  {id:"campaigns",label:"캠페인",ic:"◈"},
  {id:"tasks",label:"업무 보드",ic:"▤"},
  {grp:"경영"},
  {id:"finance",label:"청구·재무",ic:"₩"},
  {id:"team",label:"팀·근태",ic:"◐"},
  {id:"reports",label:"리포트",ic:"▦"},
  {grp:"시스템"},
  {id:"settings",label:"설정",ic:"⚙"},
];
const TITLES = {dashboard:"대시보드",clients:"클라이언트",campaigns:"캠페인",tasks:"업무 보드",
  finance:"청구·재무",team:"팀·근태",reports:"리포트",settings:"설정"};
let route = (location.hash.replace("#/","")||"dashboard");
window.addEventListener("hashchange",()=>{ route = location.hash.replace("#/","")||"dashboard"; render(); window.scrollTo(0,0); });

/* ===================================================================== */
/*  RENDER                                                               */
/* ===================================================================== */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = sidebar() + `<div class="main">${topbar()}<div class="content">${view()}</div></div>`;
}
function sidebar(){
  const items = NAV.map(n=> n.grp ? `<div class="grp">${n.grp}</div>`
    : `<a href="#/${n.id}" class="${route===n.id?"active":""}"><span class="ic">${n.ic}</span>${n.label}</a>`).join("");
  return `<aside class="side" id="side">
    <div class="brand">VENOM<span class="dot"></span>
      <small>${esc(DB.meta.tagline)} · ERP</small></div>
    <nav class="nav">${items}</nav>
    <div class="foot">v1.0 · <b>${esc(DB.meta.org)}</b> 통합 관리<br>데이터는 이 브라우저에 저장됩니다</div>
  </aside>`;
}
function topbar(){
  const me = DB.meta.me;
  return `<header class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="icon-btn menu-btn" data-act="menu" style="font-size:18px">☰</button>
      <div><h1>${TITLES[route]||"VENOM ERP"}</h1>
        <div class="crumb">VENOM 마케팅 에이전시 · 2026 회계연도</div></div>
    </div>
    <div class="who">
      <div style="text-align:right"><div class="nm">${esc(me.name)}</div>
        <div class="rl">${esc(me.role)}</div></div>
      <div class="av">${esc(initials(me.name))}</div>
    </div>
  </header>`;
}
function view(){
  switch(route){
    case "dashboard": return vDashboard();
    case "clients":   return vClients();
    case "campaigns": return vCampaigns();
    case "tasks":     return vTasks();
    case "finance":   return vFinance();
    case "team":      return vTeam();
    case "reports":   return vReports();
    case "settings":  return vSettings();
    default: return `<div class="empty"><div class="em">🧭</div>페이지를 찾을 수 없습니다.</div>`;
  }
}

/* ---------- Dashboard ---------- */
function vDashboard(){
  const activeClients = DB.clients.filter(c=>c.status==="진행중").length;
  const mrr = DB.clients.reduce((a,c)=>a+(c.mrr||0),0);
  const runningC = DB.campaigns.filter(c=>c.status==="진행중").length;
  const openTasks = DB.tasks.filter(t=>t.status!=="done").length;
  const receivable = DB.invoices.filter(i=>i.status!=="완납").reduce((a,i)=>a+i.amount,0);
  const overdue = DB.invoices.filter(i=>i.status==="연체").reduce((a,i)=>a+i.amount,0);

  const kpi = (ic,lab,val,sub)=>`<div class="card kpi"><div class="ic">${ic}</div>
    <div class="lab">${lab}</div><div class="val">${val}</div><div class="sub">${sub}</div></div>`;

  // channel spend for bar chart
  const byChannel = {};
  DB.campaigns.forEach(c=>{ byChannel[c.channel]=(byChannel[c.channel]||0)+c.spent; });
  const chData = Object.entries(byChannel).sort((a,b)=>b[1]-a[1]);
  const maxSpend = Math.max(...chData.map(d=>d[1]),1);
  const bars = chData.map(([k,v])=>`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:11px">
      <div style="width:78px;font-size:12.5px;color:var(--sub);text-align:right">${esc(k)}</div>
      <div class="prog" style="flex:1;height:22px;border-radius:7px">
        <i style="width:${(v/maxSpend*100).toFixed(1)}%;border-radius:7px"></i></div>
      <div style="width:64px;font-size:12.5px;font-weight:700;text-align:right">${K(v)}</div>
    </div>`).join("");

  // deadlines
  const soon = [...DB.campaigns].filter(c=>c.status!=="완료")
    .sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5).map(c=>`
    <div class="list-row">
      <div><div class="t-name">${esc(c.name)}</div>
        <div class="muted" style="font-size:12px">${clientName(c.client)} · ${esc(c.channel)}</div></div>
      <div style="text-align:right"><div style="font-weight:700;font-size:12.5px">${esc(c.due)}</div>
        <div style="margin-top:4px">${badge(c.status)}</div></div>
    </div>`).join("");

  // top clients donut
  const top = [...DB.clients].filter(c=>c.mrr>0).sort((a,b)=>b.mrr-a.mrr).slice(0,5);
  const donut = donutChart(top.map(c=>({label:c.name,value:c.mrr})));

  return `
  <div class="grid kpis" style="margin-bottom:22px">
    ${kpi("◇","활성 클라이언트",activeClients+"곳",`전체 ${DB.clients.length}곳 · <span class="trend up">▲ 2</span> 이번 분기`)}
    ${kpi("₩","월 반복 매출 (MRR)",K(mrr),`계약 기준 · <span class="trend up">▲ 8.4%</span> 전월 대비`)}
    ${kpi("◈","진행 캠페인",runningC+"건",`미완료 업무 ${openTasks}건 연동`)}
    ${kpi("!","미수금",K(receivable),overdue>0?`<span class="trend down">연체 ${K(overdue)}</span> 포함`:"연체 없음")}
  </div>

  <div class="cols c32" style="margin-bottom:16px">
    <div class="card pad">
      <div class="sect"><h2>채널별 집행 광고비</h2><span class="hint">캠페인 spent 합계</span></div>
      ${bars || `<div class="muted">데이터 없음</div>`}
    </div>
    <div class="card pad">
      <div class="sect"><h2>매출 비중 (MRR)</h2></div>
      ${donut}
    </div>
  </div>

  <div class="cols c2">
    <div class="card pad">
      <div class="sect"><h2>다가오는 캠페인 마감</h2>
        <a class="btn sm ghost" href="#/campaigns">전체 →</a></div>
      ${soon || `<div class="muted">예정된 마감이 없습니다</div>`}
    </div>
    <div class="card pad">
      <div class="sect"><h2>오늘의 우선 업무</h2>
        <a class="btn sm ghost" href="#/tasks">보드 →</a></div>
      ${DB.tasks.filter(t=>t.status!=="done").sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5).map(t=>`
        <div class="list-row">
          <div class="arow">${avatar(t.owner)}
            <div><div class="t-name">${esc(t.title)}</div>
              <div class="muted" style="font-size:12px">${clientName(t.client)} · 마감 ${esc(t.due)}</div></div></div>
          <span class="badge ${PRIO_BADGE[t.prio]}">${esc(t.prio)}</span>
        </div>`).join("")}
    </div>
  </div>`;
}

/* ---------- Tasks (Kanban) ---------- */
function vTasks(){
  const COLS = [["todo","대기"],["doing","진행"],["review","검수"],["done","완료"]];
  const cols = COLS.map(([key,label])=>{
    const items = DB.tasks.filter(t=>t.status===key);
    const cards = items.map(t=>`
      <div class="tk">
        <div class="tt">${esc(t.title)}</div>
        <div class="cl">${clientName(t.client)}</div>
        <div class="meta">
          <span class="badge ${PRIO_BADGE[t.prio]}" style="padding:2px 8px">${esc(t.prio)}</span>
          <div class="arow" style="gap:6px">
            <span class="muted" style="font-size:11px">${esc(t.due)}</span>${avatar(t.owner)}</div>
        </div>
        <div style="margin-top:9px;display:flex;gap:4px">
          ${key!=="todo"?`<button class="btn sm ghost" data-act="task-move" data-id="${t.id}" data-dir="-1">←</button>`:""}
          ${key!=="done"?`<button class="btn sm ghost" data-act="task-move" data-id="${t.id}" data-dir="1">진행 →</button>`:""}
          <button class="icon-btn" data-act="edit-task" data-id="${t.id}" style="margin-left:auto">✎</button>
        </div>
      </div>`).join("");
    return `<div class="col"><h3>${label}<span class="cnt">${items.length}</span></h3>${cards||`<div class="muted" style="font-size:12px;padding:8px 4px">비어 있음</div>`}</div>`;
  }).join("");
  return `
  <div class="toolbar"><div style="flex:1"></div>
    <button class="btn pri" data-act="new-task">+ 신규 업무</button></div>
  <div class="kb">${cols}</div>`;
}

/* ---------- Reports ---------- */
function vReports(){
  const mrr = DB.clients.reduce((a,c)=>a+c.mrr,0);
  const byTier = {};
  DB.clients.forEach(c=>{ byTier[c.tier]=(byTier[c.tier]||0)+1; });
  const byDept = {};
  DB.team.forEach(u=>{ byDept[u.dept]=(byDept[u.dept]||0)+u.util; });
  const avgUtil = Math.round(DB.team.reduce((a,u)=>a+u.util,0)/DB.team.length);
  const chan = {};
  DB.campaigns.forEach(c=>{ chan[c.channel]=(chan[c.channel]||0)+c.budget; });

  const donut1 = donutChart(Object.entries(byTier).map(([k,v])=>({label:k,value:v})));
  const donut2 = donutChart(Object.entries(chan).map(([k,v])=>({label:k,value:v})));

  return `
  <div class="grid kpis" style="margin-bottom:22px">
    <div class="card kpi"><div class="lab">연 환산 매출 (ARR)</div><div class="val">${K(mrr*12)}</div>
      <div class="sub">MRR ${K(mrr)} × 12</div></div>
    <div class="card kpi"><div class="lab">클라이언트 당 평균 매출</div>
      <div class="val">${K(Math.round(mrr/DB.clients.filter(c=>c.mrr>0).length))}</div></div>
    <div class="card kpi"><div class="lab">팀 평균 가동률</div><div class="val">${avgUtil}%</div>
      <div class="sub">${avgUtil>80?'<span class="trend down">과부하 주의</span>':'<span class="trend up">건강</span>'}</div></div>
    <div class="card kpi"><div class="lab">캠페인 완료율</div>
      <div class="val">${Math.round(DB.campaigns.filter(c=>c.status==="완료").length/DB.campaigns.length*100)}%</div></div>

/* ---------- Donut chart (SVG) ---------- */
function donutChart(data){
  const total = data.reduce((a,d)=>a+d.value,0)||1;
  const R=52,C=2*Math.PI*R,cx=70,cy=70; let off=0;
  const arcs = data.map((d,i)=>{
    const frac=d.value/total, len=frac*C, col=AV[i%AV.length];
    const seg=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${col}"
      stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"
      transform="rotate(-90 ${cx} ${cy})"/>`;
    off+=len; return seg;
  }).join("");
  const legend = data.map((d,i)=>`<span><i style="background:${AV[i%AV.length]}"></i>
    ${esc(d.label)} <b style="color:var(--ink);margin-left:2px">${Math.round(d.value/total*100)}%</b></span>`).join("");
  return `<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
    <svg width="140" height="140" viewBox="0 0 140 140" style="flex:0 0 140px">${arcs}
      <text x="70" y="66" text-anchor="middle" font-size="12" fill="#8f8a83">합계</text>
      <text x="70" y="84" text-anchor="middle" font-size="15" font-weight="800" fill="#1a1c20">${data.length}</text>
    </svg>
    <div class="legend" style="flex-direction:column;gap:8px;margin:0">${legend}</div></div>`;
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act, id=t.dataset.id;
  switch(act){
    case "menu": document.getElementById("side").classList.toggle("open"); break;
    case "close": case "ov-close": if(e.target===t) closeModal(); break;
    case "new-client": clientForm(); break;
    case "edit-client": clientForm(DB.clients.find(c=>c.id===id)); break;
    case "new-campaign": campaignForm(); break;
    case "edit-campaign": campaignForm(DB.campaigns.find(c=>c.id===id)); break;
    case "new-task": taskForm(); break;
    case "edit-task": taskForm(DB.tasks.find(x=>x.id===id)); break;
    case "new-invoice": invoiceForm(); break;
    case "edit-invoice": invoiceForm(DB.invoices.find(x=>x.id===id)); break;
    case "new-member": memberForm(); break;
    case "edit-member": memberForm(DB.team.find(x=>x.id===id)); break;
    case "new-leave": leaveForm(); break;
    case "task-move":{
      const order=["todo","doing","review","done"], tk=DB.tasks.find(x=>x.id===id);
      const ni=order.indexOf(tk.status)+ +t.dataset.dir;
      if(ni>=0&&ni<order.length){ tk.status=order[ni]; save();render(); }
      break; }
    case "mark-paid":{ const iv=DB.invoices.find(x=>x.id===id); iv.status="완납"; save();render();toast("입금 확인됨"); break; }
    case "leave":{ const l=DB.leaves.find(x=>x.id===id); l.status=t.dataset.v; save();render();toast(t.dataset.v+" 처리됨"); break; }
    case "del":{
      const col=t.dataset.col;
      if(confirm("삭제하시겠습니까?")){ DB[col]=DB[col].filter(x=>x.id!==id); save();render();toast("삭제되었습니다"); }
      break; }
    case "save-settings":{
      DB.meta.org=val("set-org"); DB.meta.tagline=val("set-tag");
      DB.meta.me.name=val("set-me"); DB.meta.me.role=val("set-role");
      save();render();toast("설정이 저장되었습니다"); break; }
    case "reset": if(confirm("모든 변경을 지우고 시드 데이터로 되돌립니다.")) resetDB(); break;
    case "export": exportJSON(); break;
  }
});
document.addEventListener("change",e=>{
  const f=e.target.closest('[data-act="import"]'); if(f&&f.files[0]) importJSON(f.files[0]);
});
document.addEventListener("input",e=>{
  const s=e.target.closest("[data-filter]");
  if(s){ const q=e.target.value.toLowerCase();
    document.querySelectorAll("#"+s.dataset.filter+" tr").forEach(tr=>{
      tr.style.display=tr.textContent.toLowerCase().includes(q)?"":"none"; }); }
});
document.addEventListener("change",e=>{
  const s=e.target.closest("[data-rowfilter]");
  if(s){ const col=+s.dataset.col, v=e.target.value;
    document.querySelectorAll("#"+s.dataset.rowfilter+" tr").forEach(tr=>{
      const cell=tr.children[col]; tr.style.display=(!v||(cell&&cell.textContent.includes(v)))?"":"none"; }); }
});

function val(id){ return (document.getElementById(id)||{}).value||""; }

/* ---------- Import / export ---------- */
function exportJSON(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="venom-erp-data.json"; a.click(); URL.revokeObjectURL(a.href);
  toast("데이터를 내보냈습니다");
}
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{ try{ DB=JSON.parse(r.result); save();render();toast("데이터를 가져왔습니다"); }
    catch(e){ toast("잘못된 파일입니다"); } };
  r.readAsText(file);
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg){
  const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),2200);
}

render();
